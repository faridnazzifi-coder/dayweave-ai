<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayweave AI — Plan Your Day</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#f8fafc;font-family:Inter,Arial,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:48px 22px}
.logo{font-size:14px;font-weight:700;letter-spacing:2px;color:#a7f3d0}
h1{font-size:clamp(36px,7vw,58px);letter-spacing:-2px;line-height:1.1;margin:26px 0 14px}
p{color:#aab5c8;line-height:1.7}
.panel{margin-top:30px;background:#151f32;border:1px solid #29364b;border-radius:20px;padding:24px}
label{display:block;font-weight:600;margin-bottom:12px}
textarea{width:100%;height:160px;background:#0b1120;color:white;border:1px solid #35445c;border-radius:12px;padding:15px;font:inherit;resize:vertical}
textarea:focus{outline:2px solid #a7f3d0}
button{margin-top:14px;background:#a7f3d0;color:#10201d;border:0;border-radius:10px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer}
button:hover{filter:brightness(.94)}
#result{margin-top:22px}
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #29364b;color:#f8fafc}
.task input{margin-top:5px;accent-color:#a7f3d0;width:17px;height:17px}
.task input:checked+span{text-decoration:line-through;color:#8290a6}
.note{font-size:13px;color:#8290a6;margin-top:24px}
footer{margin-top:40px;color:#718096;font-size:12px}
</style>
</head>
<body>
<main>
  <div class="logo">✳ DAYWEAVE AI</div>
  <h1>Make room for<br>what matters.</h1>
  <p>Clear your mind. Organize your tasks. Take control of today, one step at a time.</p>
  <section class="panel">
    <label for="tasks">What's on your mind today?</label>
    <textarea id="tasks" placeholder="Write your tasks, one per line...&#10;&#10;Exercise&#10;Answer emails&#10;Work on my project"></textarea>
    <button id="organize" type="button">Organize my day →</button>
    <div id="result" aria-live="polite"></div>
  </section>
  <p class="note">Your list stays in this page. This demo does not send your text to a server.</p>
  <footer>DAYWEAVE AI · A calmer way to plan your day.</footer>
</main>
<script>
document.getElementById('organize').addEventListener('click',function(){
  const input=document.getElementById('tasks').value.trim();
  const result=document.getElementById('result');
  result.replaceChildren();
  if(!input){
    result.textContent='Add a few tasks above to get started.';
    return;
  }
  const heading=document.createElement('h2');
  heading.textContent='Your task list';
  heading.style.fontSize='20px';
  result.appendChild(heading);
  input.split(/\n|[,;]/).map(x=>x.trim()).filter(Boolean).forEach(function(task){
    const row=document.createElement('label');
    row.className='task';
    const checkbox=document.createElement('input');
    checkbox.type='checkbox';
    const text=document.createElement('span');
    text.textContent=task;
    row.append(checkbox,text);
    result.appendChild(row);
  });
});
</script>
</body>
</html>
